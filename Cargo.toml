[package]
name = "fm-savelens-backend"
version = "1.0.0"
edition = "2021"
publish = false
description = "Read-only Football Manager 2024 save database"

[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "2"

[lib]
path = "native/lib.rs"

[[bin]]
name = "fm-savelens-24-server"
path = "native/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
fs2 = "0.4"
mime_guess = "2"
open = "5"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.13"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

