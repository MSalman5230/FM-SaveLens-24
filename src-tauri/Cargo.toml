[package]
name = "fm-savelens-24"
version = "1.4.0"
edition = "2021"
publish = false
description = "FM SaveLens 24 desktop application"

[dependencies]
fm-savelens-backend = { path = "..", version = "1.4.0" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
