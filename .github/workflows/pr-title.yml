name: PR title
on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR number whose title should be validated
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: pr-title-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: false
jobs:
  title:
    name: Check title
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Publishing commit statuses requires write permissions. Only execute trusted code from
      # the default branch, never the PR head, merge ref, or contributed scripts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const {checkPullRequestTitle} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-title.mjs`);
            await checkPullRequestTitle({github, context, core});
