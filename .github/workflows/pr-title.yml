name: PR title
on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open PR number to check and automatically correct when possible
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: pr-title-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: false
jobs:
  title:
    name: Check and fix title
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # pull_request_target has write permissions. Only execute trusted code from
      # the default branch, never the PR head, merge ref, or contributed scripts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {checkPullRequestTitle} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pr-title.mjs`);
            await checkPullRequestTitle({github, context, core});
